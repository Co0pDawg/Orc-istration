<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How this was built</title>
<!--
  "How this was built": the sprint story page (orchestration/sprint.md, polish ladder rung 6).
  Fill it with make-story.mjs beside this file: it writes docs/story.html with the "sprint-events" block
  below set to {"meta": <story-meta.json>, "events": <sprint-events.json>}, escaped for a script element.
  The page reads nothing else: no fetch and no network, so it works opened straight from disk.

  The link below fits docs/story.html with the shared theme copied to src/theme/. Adjust the path if the
  theme lives elsewhere. Without the theme, the inline styles keep the page readable; they come first so
  the theme's rules win. Every fallback selector sits in :where(), so it adds no specificity.
-->
<style>
  :where(body) { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fafafa; color: #1d1d1f; }
  :where(.ui-header-inner, main, footer) { max-width: 60rem; margin: 0 auto; padding: 1rem; }
  :where(h1) { margin: 0; font-size: 1.75rem; }
  :where(h2) { font-size: 1.2rem; margin: 0 0 0.5rem; }
  :where(main section) { margin-top: 1.5rem; }
  :where(.ui-brand) { margin: 0; font-weight: 600; color: #555; }
  :where(.story-sub) { margin: 0.25rem 0 0; color: #555; }
  :where(.story-foot) { color: #555; }
  :where(.story-tiles) { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.75rem; list-style: none; padding: 0; margin: 0; }
  :where(.ui-card) { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem; background: #fff; }
  :where(.story-tile-value) { display: block; font-size: 1.4rem; font-weight: 600; }
  :where(.story-acs) { list-style: none; padding: 0; margin: 0; }
  :where(.story-acs li) { padding: 0.4rem 0; }
  :where(.ui-chip, .ui-timeline-kind) { display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 0 0.6rem; font-size: 0.85rem; }
  :where(.ui-timeline) { list-style: none; padding: 0; margin: 0; }
  :where(.ui-timeline-item) { border: 1px solid #ddd; border-radius: 8px; padding: 0.5rem 0.75rem; margin: 0 0 0.75rem; background: #fff; }
  :where(.ui-timeline-item[data-kind="correction"]) { border-color: #c0392b; border-left-width: 4px; background: #fff4f2; }
  :where(.ui-timeline-time) { margin-left: 0.5rem; color: #555; font-size: 0.9rem; }
  :where(.ui-timeline-text) { margin: 0.25rem 0 0; }
  :where(.story-title) { font-weight: 600; margin: 0; }
  :where(.story-detail) { margin: 0.15rem 0 0; }
  :where(.story-refs) { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #555; margin: 0.15rem 0 0; }
  :where(#story-error:not([hidden])) { border: 1px solid #c0392b; border-left-width: 4px; padding: 0.75rem; color: #8e1b10; background: #fff4f2; }
  @media (prefers-color-scheme: dark) {
    :where(body) { background: #161618; color: #eee; }
    :where(.story-sub, .story-foot, .ui-timeline-time, .story-refs, .ui-brand) { color: #aaa; }
    :where(.ui-card, .ui-timeline-item) { background: #222; border-color: #333; }
    :where(.ui-timeline-item[data-kind="correction"]) { background: #2a1a18; border-color: #e57366; }
    :where(#story-error:not([hidden])) { color: #f4b4ab; background: #2a1a18; border-color: #e57366; }
  }
</style>
<link rel="stylesheet" href="../src/theme/theme.css">
</head>
<body>
<header class="ui-header">
  <div class="ui-header-inner">
    <div>
      <p class="ui-brand">How this was built</p>
      <h1 class="ui-title" id="story-title">Sprint project</h1>
      <p class="ui-subtitle story-sub"><span id="story-clock"></span> <span id="story-elapsed"></span></p>
    </div>
  </div>
</header>
<main>
  <p id="story-error" role="alert" hidden></p>
  <section aria-labelledby="h-glance">
    <h2 class="ui-heading" id="h-glance">At a glance</h2>
    <ul class="story-tiles" id="story-tiles" role="list"></ul>
  </section>
  <section aria-labelledby="h-requirements">
    <h2 class="ui-heading" id="h-requirements">Requirements</h2>
    <ul class="story-acs" id="story-acs" role="list"></ul>
  </section>
  <section aria-labelledby="h-timeline">
    <h2 class="ui-heading" id="h-timeline">Timeline</h2>
    <ol class="ui-timeline" id="story-timeline" role="list"></ol>
  </section>
</main>
<footer class="story-foot">
  <p>Built in sprint mode with Orc-istration</p>
</footer>

<!-- make-story.mjs fills this block from story-meta.json and sprint-events.json. The sample below is illustrative only. -->
<script type="application/json" id="sprint-events">
{
  "meta": {
    "title": "Example project",
    "clock": 45,
    "start": "2026-01-05T10:00:00-05:00",
    "deadline": "2026-01-05T10:45:00-05:00",
    "coreComplete": "2026-01-05T10:31:00-05:00",
    "acs": [
      { "id": "AC-1", "text": "A user can add an item and see it in the list", "status": "met" },
      { "id": "AC-2", "text": "An empty item is rejected with a message", "status": "not met" }
    ],
    "tests": { "passed": 6, "total": 6 },
    "hidden": { "found": 3, "total": 4 }
  },
  "events": [
    { "at": "2026-01-05T10:07:00-05:00", "kind": "requirement", "title": "Requirements agreed", "refs": ["AC-1", "AC-2"] },
    { "at": "2026-01-05T10:18:00-05:00", "kind": "build", "title": "Slice 1 committed", "refs": ["AC-1"] },
    { "at": "2026-01-05T10:24:00-05:00", "kind": "review", "title": "Refuter on slice 1: REWORK, one must-fix" },
    { "at": "2026-01-05T10:28:00-05:00", "kind": "correction", "title": "List lost items on reload", "detail": "Items were kept only in memory.", "caughtBy": "the refuter, not the tests", "fix": "Persist the list after each change.", "guard": "Regression test for reload" },
    { "at": "2026-01-05T10:31:00-05:00", "kind": "milestone", "title": "Core complete" },
    { "at": "2026-01-05T10:36:00-05:00", "kind": "decision", "title": "AC-2 deferred at the freeze", "late": true }
  ]
}
</script>
<script>
'use strict';
// The data-to-view logic as small pure functions; tests/story-page.test.mjs runs this script in node.
const storyLogic = (() => {
  const KINDS = ['requirement', 'decision', 'build', 'review', 'correction', 'milestone'];
  const DASH = '\u2013';
  const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  // The UTC offset in minutes from an ISO time's suffix, or null when it has none.
  const offsetMinutes = (iso) => {
    const m = typeof iso === 'string' ? /(Z|([+-])(\d{2}):?(\d{2}))$/.exec(iso) : null;
    if (!m) return null;
    if (m[1] === 'Z') return 0;
    return (m[2] === '-' ? -1 : 1) * (Number(m[3]) * 60 + Number(m[4]));
  };

  // A Date, or null. Once the sprint's zone is known, a time without an offset is invalid too.
  const parseTime = (iso, zone) => {
    if (typeof iso !== 'string') return null;
    if (zone !== null && offsetMinutes(iso) === null) return null;
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? null : d;
  };

  // What the block's root lacks, or null when it is {"meta": {...}, "events": [...]}.
  const rootProblem = (data) => {
    const missing = [];
    if (!isObject(data) || !isObject(data.meta)) missing.push('a "meta" object');
    if (!isObject(data) || !Array.isArray(data.events)) missing.push('an "events" array');
    if (!missing.length) return null;
    return 'The sprint-events block must hold {"meta": {...}, "events": [...]}, but it is missing ' +
      missing.join(' and ') + '. Fill it with make-story.mjs.';
  };

  // Events in time order. Those without a valid time go last, in the order they were recorded.
  const sortEvents = (events, zone) => events
    .filter(isObject)
    .map((e, i) => ({ e, i, t: parseTime(e.at, zone) }))
    .sort((a, b) => {
      if ((a.t === null) !== (b.t === null)) return a.t === null ? 1 : -1;
      return (a.t === null ? 0 : a.t - b.t) || a.i - b.i;
    })
    .map((x) => x.e);

  const kindOf = (e) => (KINDS.includes(e.kind) ? e.kind : 'other');
  const kindLabel = (kind) => kind.charAt(0).toUpperCase() + kind.slice(1);

  // Clock times use the sprint's own offset (the one on meta.start), not the viewer's time zone.
  const clockTime = (iso, zone) => {
    const d = parseTime(iso, zone);
    if (!d) return DASH;
    if (zone === null) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const local = new Date(d.getTime() + zone * 60000);
    const h = local.getUTCHours();
    return ((h % 12) || 12) + ':' + String(local.getUTCMinutes()).padStart(2, '0') + (h < 12 ? ' AM' : ' PM');
  };

  const minutesBetween = (a, b, zone) => {
    const x = parseTime(a, zone);
    const y = parseTime(b, zone);
    return x && y ? Math.floor((y - x) / 60000) : null;
  };

  const eventTime = (e, start, zone) => {
    const late = e.late === true ? ', noted late' : '';
    if (!parseTime(e.at, zone)) return 'time not recorded' + late;
    const mins = minutesBetween(start, e.at, zone);
    return clockTime(e.at, zone) + (mins === null ? '' : ' (' + mins + ' min)') + late;
  };

  // Exact statuses only; anything else is unknown and never counts as met.
  const acStatus = (status) => {
    if (status === 'met') return ['ok', 'Met'];
    if (status === 'not met') return ['danger', 'Not met'];
    return ['info', 'Unknown'];
  };

  const acsOf = (meta) => (Array.isArray(meta.acs) ? meta.acs.filter(isObject) : []);

  // Minutes from the start to the last event with a valid time, or null.
  const elapsed = (meta, sorted, zone) => {
    const timed = sorted.filter((e) => parseTime(e.at, zone));
    return timed.length ? minutesBetween(meta.start, timed[timed.length - 1].at, zone) : null;
  };

  const tiles = (meta, sorted, zone) => {
    const acs = acsOf(meta);
    const met = acs.filter((a) => acStatus(a.status)[0] === 'ok').length;
    const unknown = acs.filter((a) => acStatus(a.status)[0] === 'info').length;
    const core = minutesBetween(meta.start, meta.coreComplete, zone);
    const tests = isObject(meta.tests) ? meta.tests : null;
    let testText = DASH;
    if (tests && tests.total !== undefined) {
      testText = (tests.passed !== undefined ? tests.passed + ' of ' : '') + tests.total;
    }
    const list = [
      ['Core complete', core === null ? DASH : core + ' min'],
      ['Acceptance criteria met', acs.length ? met + ' of ' + acs.length + (unknown ? ' (' + unknown + ' unknown)' : '') : DASH]
    ];
    if (isObject(meta.hidden)) list.push(['Hidden criteria found', meta.hidden.found + ' of ' + meta.hidden.total]);
    list.push(
      ['Tests passing', testText],
      ['Reviews', sorted.filter((e) => kindOf(e) === 'review').length],
      ['Self-corrections', sorted.filter((e) => kindOf(e) === 'correction').length]
    );
    return list;
  };

  return {
    DASH, isObject, offsetMinutes, parseTime, rootProblem, sortEvents, kindOf, kindLabel, clockTime,
    minutesBetween, eventTime, acStatus, acsOf, elapsed, tiles
  };
})();

(() => {
  const L = storyLogic;
  // The theme class names this script sets (orchestration/sprint/theme/theme.css), so they are easy to realign.
  const THEME = {
    alert: 'ui-alert ui-alert--danger',
    card: 'ui-card',
    chip: (variant) => 'ui-chip ui-chip--' + variant,
    item: 'ui-timeline-item',
    kind: 'ui-timeline-kind',
    time: 'ui-timeline-time',
    text: 'ui-timeline-text'
  };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };
  const byId = (id) => document.getElementById(id);
  const showError = (message) => {
    const p = byId('story-error');
    p.className = THEME.alert;
    p.textContent = message;
    p.hidden = false;
  };

  let data;
  try {
    data = JSON.parse(byId('sprint-events').textContent);
  } catch {
    showError('The sprint-events block could not be read as JSON. Fill it with make-story.mjs.');
    return;
  }
  const problem = L.rootProblem(data);
  if (problem) {
    showError(problem);
    return;
  }
  const meta = data.meta;
  const zone = L.offsetMinutes(meta.start);
  const events = L.sortEvents(data.events, zone);

  // Header: the project title, the clock and the elapsed time.
  if (meta.title) {
    byId('story-title').textContent = String(meta.title);
    document.title = 'How ' + meta.title + ' was built';
  }
  byId('story-clock').textContent = (meta.clock ? meta.clock + '-minute sprint' : 'Sprint') +
    (meta.start ? ', ' + L.clockTime(meta.start, zone) + ' to ' + L.clockTime(meta.deadline, zone) : '') + '.';
  const elapsed = L.elapsed(meta, events, zone);
  byId('story-elapsed').textContent = elapsed === null ? '' : 'Elapsed: ' + elapsed + ' min to the last event.';

  // Stat tiles
  const tileList = byId('story-tiles');
  for (const [label, value] of L.tiles(meta, events, zone)) {
    const li = el('li', THEME.card);
    li.appendChild(el('span', 'story-tile-value', value));
    li.appendChild(el('span', 'story-tile-label', label));
    tileList.appendChild(li);
  }

  // Requirements: met, not-met or unknown chips, with the status in text as well as colour.
  const acs = L.acsOf(meta);
  const acList = byId('story-acs');
  if (!acs.length) acList.appendChild(el('li', null, 'No acceptance criteria recorded.'));
  for (const a of acs) {
    const li = el('li');
    const [variant, label] = L.acStatus(a.status);
    li.appendChild(el('span', THEME.chip(variant), label));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('strong', null, a.id || L.DASH));
    li.appendChild(document.createTextNode(a.text ? ' ' + a.text : ''));
    acList.appendChild(li);
  }

  // Timeline: kind badge, time, then the text. A correction also shows what caught it.
  const list = byId('story-timeline');
  if (!events.length) list.appendChild(el('li', null, 'No events recorded.'));
  for (const e of events) {
    const kind = L.kindOf(e);
    const li = el('li', THEME.item);
    li.setAttribute('data-kind', kind);
    li.appendChild(el('span', THEME.kind, L.kindLabel(kind)));
    li.appendChild(document.createTextNode(' '));
    const t = el('time', THEME.time, L.eventTime(e, meta.start, zone));
    if (L.parseTime(e.at, zone)) t.setAttribute('datetime', e.at);
    li.appendChild(t);
    const body = el('div', THEME.text);
    body.appendChild(el('p', 'story-title', e.title || L.DASH));
    if (e.detail) body.appendChild(el('p', 'story-detail', e.detail));
    if (kind === 'correction') {
      body.appendChild(el('p', 'story-detail', 'Caught by: ' + (e.caughtBy || 'not recorded')));
      if (e.fix) body.appendChild(el('p', 'story-detail', 'Fix: ' + e.fix));
      if (e.guard) body.appendChild(el('p', 'story-detail', 'Guard: ' + e.guard));
    }
    if (Array.isArray(e.refs) && e.refs.length) body.appendChild(el('p', 'story-refs', e.refs.join(', ')));
    li.appendChild(body);
    list.appendChild(li);
  }
})();
</script>
</body>
</html>
